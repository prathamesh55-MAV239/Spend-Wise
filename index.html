<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SpendWise is a personal expense tracker that helps you monitor spending and stay on top of your budget."
    />
    <title>SpendWise | Personal Expense Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-block">
          <p class="eyebrow">Personal Expense Tracker</p>
          <h1>SpendWise</h1>
        </div>
        <div class="tagline">Track your money. Manage your future.</div>
      </header>

      <main class="dashboard">
        <section class="summary-grid" aria-label="Expense summary cards">
          <article class="summary-card total-card">
            <span class="summary-label">Total Expenditure</span>
            <strong id="total-expenses">₹0.00</strong>
            <small id="transaction-count">0 transactions</small>
          </article>

          <article class="summary-card">
            <span class="summary-label">Top Category</span>
            <strong id="top-category">No data</strong>
            <small id="top-category-amount">₹0.00</small>
          </article>

          <article class="summary-card">
            <span class="summary-label">This Month</span>
            <strong id="monthly-total">₹0.00</strong>
            <small>Current month</small>
          </article>
        </section>

        <section class="content-grid">
          <div class="panel form-panel">
            <div class="section-header">
              <h2>Add Expense</h2>
            </div>

            <form id="expense-form" novalidate>
              <div class="field-group">
                <label for="expense-name">Expense name</label>
                <input
                  id="expense-name"
                  name="expense-name"
                  type="text"
                  placeholder="e.g. Grocery shopping"
                  maxlength="80"
                  required
                />
              </div>

              <div class="field-row">
                <div class="field-group">
                  <label for="expense-amount">Amount</label>
                  <input
                    id="expense-amount"
                    name="expense-amount"
                    type="number"
                    step="0.01"
                    min="0.01"
                    placeholder="0.00"
                    required
                  />
                </div>

                <div class="field-group">
                  <label for="expense-category">Category</label>
                  <select id="expense-category" name="expense-category" required>
                    <option value="">Select</option>
                    <option value="Food">Food</option>
                    <option value="Travel">Travel</option>
                    <option value="Education">Education</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Other">Other</option>
                  </select>
                </div>
              </div>

              <div class="field-group">
                <label for="expense-date">Date</label>
                <input id="expense-date" name="expense-date" type="date" required />
              </div>

              <button type="submit" class="primary-btn">Add Expense</button>
              <p id="form-message" class="form-message" aria-live="polite"></p>
            </form>
          </div>

          <div class="panel">
            <div class="section-header">
              <h2>Category Summary</h2>
            </div>
            <div id="category-summary" class="category-summary" aria-live="polite"></div>
          </div>
        </section>

        <section class="panel history-panel">
          <div class="section-header">
            <h2>Expense History</h2>
          </div>

          <div id="empty-state" class="empty-state" aria-live="polite">
            <div class="empty-icon" aria-hidden="true">₹</div>
            <h3>No expenses yet</h3>
            <p>Add your first expense to start tracking your spending.</p>
          </div>

          <ul id="expense-list" class="expense-list" aria-live="polite"></ul>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
